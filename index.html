<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9a46c">
<title>Feliz cumpleaños 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Indie+Flower&family=Pacifico&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
  :root{
    --pink:#ec407a; --dark:#c2185b; --soft:#f8bbd0; --paper:#fff4f7; --ink:#5a3a46;
    --ease:cubic-bezier(.645,.045,.355,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:'Patrick Hand',cursive;color:var(--ink);
    display:flex;flex-direction:column;height:100dvh;
    background:#d9a46c;-webkit-user-select:none;user-select:none;
  }

  /* ---------- MESA ---------- */
  #mesa{
    position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(255,244,230,.30), rgba(70,35,10,.28) 100%),
      repeating-linear-gradient(0deg, rgba(90,50,20,.38) 0 2px, transparent 2px 150px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 3px, rgba(0,0,0,.035) 3px 6px),
      linear-gradient(180deg,#e6bd8d,#d3a06a);
  }
  .mantelito{
    position:absolute;left:50%;top:46%;width:min(98vw,1250px);height:min(82vh,820px);
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,232,240,.85), rgba(255,208,224,.45) 70%, rgba(255,208,224,0));
  }
  .acc{
    position:absolute;line-height:1;pointer-events:auto;
    filter:drop-shadow(2px 5px 3px rgba(60,30,10,.38));
    transition:transform .3s;
  }
  .acc:active{transform:scale(1.15) rotate(8deg)!important}

  /* ---------- ESCENARIO ---------- */
  main{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #holder{position:relative;flex:none;touch-action:none}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;perspective:2600px}

  .book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--ease)}
  .leaf{
    position:absolute;left:400px;top:0;width:400px;height:560px;
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform .9s var(--ease);
  }
  .face{
    position:absolute;left:0;top:0;width:400px;height:560px;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    cursor:grab;
  }
  .face.back{transform:rotateY(180deg)}
  .face.right{border-radius:4px 16px 16px 4px;box-shadow:0 12px 28px rgba(70,25,40,.38), inset 8px 0 14px -8px rgba(0,0,0,.2)}
  .face.left{border-radius:16px 4px 4px 16px;box-shadow:0 12px 28px rgba(70,25,40,.38), inset -8px 0 14px -8px rgba(0,0,0,.2)}
  .leaf.flipped .face:not(.back){pointer-events:none}
  .leaf:not(.flipped) .face.back{pointer-events:none}

  /* modo una sola página (celular) */
  .single .face{transform-origin:left center;transition:transform .85s var(--ease)}
  .single .face.gone{pointer-events:none}

  /* sombra / brillo de la hoja al girar */
  .shade{
    position:absolute;inset:0;z-index:30;pointer-events:none;border-radius:inherit;
    opacity:var(--sh,0);transition:opacity .9s;
  }
  .right .shade{background:
    linear-gradient(to right, rgba(60,10,30,.55), rgba(60,10,30,0) 55%),
    linear-gradient(to right, transparent 60%, rgba(255,255,255,.45) 82%, transparent 100%)}
  .left .shade{background:
    linear-gradient(to left, rgba(60,10,30,.55), rgba(60,10,30,0) 55%),
    linear-gradient(to left, transparent 60%, rgba(255,255,255,.45) 82%, transparent 100%)}
  .dragging .shade{transition:none}
  .dragging{cursor:grabbing}

  .paper{
    background-color:var(--paper);
    background-image:radial-gradient(rgba(236,64,122,.16) 1px, transparent 1.3px);
    background-size:18px 18px;
  }
  .holes{
    position:absolute;top:0;bottom:0;width:22px;pointer-events:none;
    background:radial-gradient(circle at 50% 50%, #e8a3b7 0 3.5px, rgba(0,0,0,.14) 4px 5px, transparent 5.5px) 0 0/22px 36px repeat-y;
  }
  .right .holes{left:2px}
  .left .holes{right:2px}

  /* ---------- PEGATINAS ---------- */
  .stk{
    position:absolute;pointer-events:none;z-index:6;
    filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(1px 3px 3px rgba(80,20,40,.28));
  }
  .emo{line-height:1}

  /* ---------- PORTADA ---------- */
  .cover{
    background:
      radial-gradient(rgba(255,255,255,.28) 1.2px, transparent 1.6px) 0 0/16px 16px,
      linear-gradient(145deg,#ffb7c8,#f58fb0 55%,#ec6f9c);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    text-align:center;
  }
  .cover .stitch{position:absolute;inset:14px;border:2.5px dashed rgba(255,255,255,.8);border-radius:10px;pointer-events:none}
  .rings{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;
    background:radial-gradient(circle at 50% 50%, #fff 0 5px, #b0b6bd 5.5px 8px, rgba(0,0,0,.18) 8.5px 10px, transparent 10.5px) 0 0/26px 38px repeat-y}
  .right .rings{left:6px}
  .left .rings{right:6px}
  .c-top{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;color:#fff;text-shadow:0 2px 0 rgba(194,24,91,.55);letter-spacing:.5px}
  .c-box{
    background:rgba(255,255,255,.9);border:3px dashed var(--dark);border-radius:18px;
    padding:14px 28px 10px;transform:rotate(-2deg);box-shadow:3px 6px 16px rgba(120,20,60,.25);
  }
  .c-24{font-family:'Fredoka',sans-serif;font-weight:700;font-size:58px;line-height:1;color:var(--dark)}
  .c-name{font-family:'Fredoka',sans-serif;font-weight:700;font-size:60px;line-height:1.1;color:var(--pink);letter-spacing:1px}
  .c-sub{font-family:'Indie Flower',cursive;font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(194,24,91,.6)}
  .c-hint{
    margin-top:6px;font-family:'Fredoka',sans-serif;font-size:16px;color:var(--dark);
    background:#fff;padding:7px 18px;border-radius:20px;box-shadow:0 3px 8px rgba(120,20,60,.25);
    animation:hint 1.8s ease-in-out infinite;
  }
  @keyframes hint{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.05)}}

  /* ---------- PÁGINAS DE FOTOS / VIDEOS ---------- */
  .pg{position:absolute;inset:0;padding:18px 22px 16px}
  .right .pg{padding-left:38px}
  .left .pg{padding-right:38px}
  .pg-title{font-family:'Pacifico',cursive;font-size:21px;color:var(--dark);text-align:center;height:36px;line-height:36px;text-shadow:1px 1px 0 #fff}
  .entries{display:flex;flex-direction:column;height:calc(100% - 38px);gap:4px}
  .entry{flex:1;display:flex;align-items:center;gap:14px;min-height:0}
  .entry.rev{flex-direction:row-reverse}
  .polaroid{
    flex:none;position:relative;background:#fff;padding:7px 7px 22px;
    box-shadow:2px 5px 12px rgba(80,20,40,.28);transform:rotate(var(--rot));
    transition:transform .25s;
  }
  .polaroid.has:active{transform:rotate(0) scale(1.04)}
  /* El marco mide 132x112 mientras no hay foto; al cargar, JS lo ajusta a la forma real
     de la foto/video (máx. 150x122) para que se vea COMPLETA, sin recortes. */
  .ph{position:relative;width:132px;height:112px;background:#ffe3ec;overflow:hidden;transition:width .3s,height .3s}
  .ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .5s}
  .ph img.ok,.ph video.ok{opacity:1}
  .empty{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:2px dashed #f48fb1;color:#ad1457;font-size:12px;text-align:center;padding:0 6px;
  }
  .empty span{word-break:break-all;line-height:1.2}
  .empty svg{width:40px;height:40px;color:#fff}
  .mini-paw{position:absolute;right:8px;bottom:4px;width:16px;height:16px;color:#f48fb1}
  .vtag{position:absolute;right:8px;bottom:3px;font-size:14px;line-height:1}
  .tape{
    position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);z-index:4;
    background:rgba(244,143,177,.65);
    background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.45) 5px 10px);
  }
  .entry:nth-child(2) .tape{transform:translateX(-50%) rotate(4deg);background-color:rgba(255,213,128,.75)}
  .note{
    position:relative;flex:1;padding:14px 10px;text-align:center;transform:rotate(var(--nrot));
    background:rgba(255,255,255,.7);border:2px dashed #f4a6bd;border-radius:12px;
  }
  .note b{font-family:'Pacifico',cursive;font-weight:400;font-size:21px;line-height:1.35;color:var(--dark);display:block;overflow-wrap:anywhere}

  /* ---------- CARTA / FIN ---------- */
  .letter{
    position:absolute;top:34px;bottom:30px;left:30px;right:30px;padding:6px 6px 0;
    font-family:'Indie Flower',cursive;font-weight:700;font-size:19px;line-height:30px;color:#6a3a4c;
    background:repeating-linear-gradient(transparent 0 29px, rgba(236,64,122,.28) 29px 30px);
  }
  .right .letter{left:44px}
  .left .letter{right:44px}
  .letter h3{font-family:'Pacifico',cursive;font-weight:400;font-size:27px;line-height:40px;color:var(--dark);margin-bottom:0}
  .letter p{margin-bottom:30px}
  .fin{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px}
  .fin h2{font-family:'Pacifico',cursive;font-weight:400;font-size:34px;line-height:1.2;color:var(--dark);text-shadow:2px 2px 0 #fff}
  .fin .big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:44px;color:var(--pink);letter-spacing:4px}
  .fin button{
    font-family:'Fredoka',sans-serif;font-size:16px;color:#fff;background:var(--pink);border:0;border-radius:24px;
    padding:10px 22px;box-shadow:0 4px 10px rgba(194,24,91,.4);cursor:pointer;margin-top:8px;
  }
  .backcover{justify-content:center}
  .backcover .paw-big{width:130px;height:130px;color:rgba(255,255,255,.85)}

  /* ---------- CONTROLES ---------- */
  .controls{
    position:relative;z-index:5;flex:none;display:flex;gap:12px;align-items:center;justify-content:center;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  }
  .controls button{
    font-family:'Fredoka',sans-serif;border:0;color:#fff;background:var(--pink);
    width:46px;height:46px;border-radius:50%;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 4px 10px rgba(120,30,60,.38);transition:transform .15s, opacity .2s;
  }
  .controls button:active{transform:scale(.92)}
  .controls button:disabled{opacity:.4;cursor:default}
  #label{
    font-family:'Fredoka',sans-serif;font-size:15px;background:#fff;color:var(--dark);
    padding:10px 16px;border-radius:22px;min-width:150px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.15);
  }

  /* ---------- VISOR (foto o video en grande) ---------- */
  #lb{
    position:fixed;inset:0;z-index:50;background:rgba(40,10,25,.85);display:none;
    align-items:center;justify-content:center;padding:18px;cursor:zoom-out;
  }
  #lb.show{display:flex}
  #lb img{max-width:100%;max-height:100%;border:10px solid #fff;border-bottom-width:30px;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #lb video{display:none;max-width:100%;max-height:100%;border:10px solid #fff;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#000;cursor:default}
</style>
</head>

function faceHTML(i, side, isBack){

/* ---------- construir libro ---------- */
function build(){
  stage.innerHTML = '';
  leaves = []; faces = [];
  if(mode === 'spread'){
    stage.style.width = '800px'; stage.style.height = '560px';
    let html = '<div class="book" id="book">';
    for(let k=0; k<N_LEAVES; k++){
      html += `<div class="leaf" data-k="${k}">${faceHTML(2*k,'right',false)}${faceHTML(2*k+1,'left',true)}</div>`;
    }
    html += '</div>';
    stage.innerHTML = html;
    book = $('#book');
    leaves = [...stage.querySelectorAll('.leaf')];
    leaves.forEach(l => l.style.transition = 'none');
    book.style.transition = 'none';
  } else {
    stage.style.width = '400px'; stage.style.height = '560px';
    let html = '<div style="position:absolute;inset:0">';
    for(let i=0; i<N_FACES; i++){ html += faceHTML(i,'right',false); }
    html += '</div>';
    stage.innerHTML = html;
    book = null;
    faces = [...stage.querySelectorAll('.face')];
    faces.forEach(f => f.style.transition = 'none');
  }
  stage.classList.toggle('single', mode === 'single');
  stage.querySelectorAll('.ph img, .ph video').forEach(loadMedia);
  fitNotes();
  applyState(pos, true);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    leaves.forEach(l => l.style.transition = '');
    faces.forEach(f => f.style.transition = '');
    if(book) book.style.transition = '';
  }));
}

/* ---------- carga de fotos y videos ---------- */
const BOX_W = 150, BOX_H = 122;          // tamaño máximo del recuadro de foto
function fitFrame(ph, w, h){
  const k = Math.min(BOX_W / w, BOX_H / h);   // se ajusta a la forma real: la foto se ve completa
  ph.style.width  = Math.round(w * k) + 'px';
  ph.style.height = Math.round(h * k) + 'px';
}
function loadMedia(el){
  const vid = el.tagName === 'VIDEO';
  const ph = el.closest('.ph'), emp = ph.querySelector('.empty');
  const ok = () => {
    const w = vid ? el.videoWidth : el.naturalWidth, h = vid ? el.videoHeight : el.naturalHeight;
    if(w && h) fitFrame(ph, w, h);
    el.classList.add('ok');
    if(emp) emp.style.display = 'none';
    const pol = el.closest('.polaroid'); if(pol) pol.classList.add('has');
    if(vid) updateVideos();
  };
  const fail = () => { el.remove(); if(emp) emp.firstElementChild.nextElementSibling.textContent = 'No se encontró: ' + decodeURI(el.dataset.src); };
  if(vid){
    el.muted = true;
    el.addEventListener('loadedmetadata', ok);
    el.addEventListener('error', fail);
  } else {
    el.onload = ok; el.onerror = fail;
  }
  el.src = el.dataset.src + (vid ? '#t=0.1' : '');
}

/* ---------- el texto de cada nota se achica solo si es largo ---------- */
// Primero prueba la letra decorativa (Pacifico) de 21px a 15px.
// Si aún no cabe, pasa a una letra más angosta (Patrick Hand) y sigue bajando hasta 10px.
const FIT_STEPS = [['Pacifico', 21, 15], ['Patrick Hand', 24, 10]];
function fitNotes(){
  stage.querySelectorAll('.note').forEach(note => {
    const b = note.firstElementChild;
    const entry = note.parentElement;
    const avail = entry.clientHeight - 12 - 32;       // alto de la fila, menos margen y relleno de la nota
    if(avail <= 0) return;
    for(const [fam, from, to] of FIT_STEPS){
      for(let sz = from; sz >= to; sz--){
        b.style.fontFamily = `'${fam}', cursive`;
        b.style.fontSize = sz + 'px';
        b.style.lineHeight = sz > 17 ? '1.35' : '1.25';
        if(b.offsetHeight <= avail) return;
      }
    }
  });
}
if(document.fonts && document.fonts.load){
  Promise.all([document.fonts.load("21px Pacifico"), document.fonts.load("20px 'Patrick Hand'")])
    .then(() => fitNotes()).catch(() => {});
  document.fonts.ready.then(() => fitNotes());
}

/* ---------- videos: solo se reproducen los de las páginas visibles ---------- */
function visibleFaces(){
  if(mode === 'spread'){
    if(pos === 0) return [0];
    if(pos === N_LEAVES) return [N_FACES - 1];
    return [2*pos-1, 2*pos];
  }
  return [pos];
}
function updateVideos(){
  if(lb.classList.contains('show')) return;
  const vis = new Set(visibleFaces());
  stage.querySelectorAll('video').forEach(v => {
    const f = v.closest('.face');
    const i = f ? +f.dataset.i : -1;
    if(vis.has(i)){ const p = v.play(); if(p && p.catch) p.catch(() => {}); }
    else v.pause();
  });
}

/* ---------- estado / animación ---------- */
function applyState(prev, instant, extra){
  if(extra === undefined) extra = -1;
  if(!instant){
    busy = true; clearTimeout(busyT);
    busyT = setTimeout(() => { busy = false; }, 950);
  }
  if(mode === 'spread'){
    const lo = Math.min(prev,pos), hi = Math.max(prev,pos);
    leaves.forEach((lf,k) => {
      const flipped = k < pos;
      const finalZ = flipped ? k+1 : N_LEAVES-k;
      clearTimeout(lf._t);
      if(!instant && ((k >= lo && k < hi) || k === extra)){
        lf.style.zIndex = 100;
        lf._t = setTimeout(() => { lf.style.zIndex = finalZ; }, 920);
      } else {
        lf.style.zIndex = finalZ;
      }
      lf.style.transform = flipped ? 'rotateY(-180deg)' : 'rotateY(0deg)';
      lf.classList.toggle('flipped', flipped);
    });
    book.style.transform = pos === 0 ? 'translateX(-200px)' : (pos === N_LEAVES ? 'translateX(200px)' : 'translateX(0)');
  } else {
    faces.forEach((f,i) => {
      const gone = i < pos;
      f.style.zIndex = N_FACES - i;
      f.style.transform = gone ? 'rotateY(-180deg)' : 'rotateY(0deg)';
      f.classList.toggle('gone', gone);
    });
  }
  updateUI();
  updateVideos();
}

function updateUI(){
  const max = mode === 'spread' ? N_LEAVES : N_FACES - 1;
  btnPrev.disabled = pos <= 0;
  btnNext.disabled = pos >= max;
  let t;
  if(mode === 'spread') t = pos === 0 ? 'Portada' : (pos === N_LEAVES ? 'Contraportada' : `Páginas ${2*pos-1} – ${2*pos}`);
  else t = pos === 0 ? 'Portada' : (pos === N_FACES - 1 ? 'Contraportada' : `Página ${pos} de ${N_FACES - 2}`);
  labelEl.textContent = t;
}

function turn(d){
  const max = mode === 'spread' ? N_LEAVES : N_FACES - 1;
  const np = pos + d;
  if(np < 0 || np > max) return;
  const prev = pos; pos = np;
  applyState(prev, false);
}

function restart(){
  const t = setInterval(() => { if(pos > 0) turn(-1); else clearInterval(t); }, 360);
}

/* ---------- tamaño / modo ---------- */
function measure(){ return { aw: main.clientWidth - 12, ah: main.clientHeight - 8 }; }
function decideMode(){
  const { aw, ah } = measure();
  const sSpread = Math.min(aw/820, ah/580);
  return (aw >= 700 && sSpread >= 0.6) ? 'spread' : 'single';
}
function fit(){
  const { aw, ah } = measure();
  const W = mode === 'spread' ? 800 : 400;
  scale = Math.min(aw/(W+20), ah/580, 1.4);
  holder.style.width = (W*scale) + 'px';
  holder.style.height = (560*scale) + 'px';
  stage.style.transform = `scale(${scale})`;
}
function setMode(m){
  if(mode === m) return;
  if(mode === 'spread' && m === 'single') pos = pos === 0 ? 0 : 2*pos - 1;
  else if(mode === 'single' && m === 'spread') pos = (pos + 1) >> 1;
  mode = m;
  build();
}

    lbPausedMusic = !audio.paused;
    if(lbPausedMusic) audio.pause();
    stage.querySelectorAll('video').forEach(v => v.pause());
    lb.classList.add('show');
    const p = lbVid.play(); if(p && p.catch) p.catch(() => {});
  } else {
    lbVid.style.display = 'none';
    lbImg.style.display = 'block';
    lbImg.src = el.src;
    lb.classList.add('show');
  }
}
function closeLb(){
  lb.classList.remove('show');
  lbVid.pause(); lbVid.removeAttribute('src'); lbVid.load();
  if(lbPausedMusic){ audio.play().catch(() => {}); lbPausedMusic = false; }
  updateVideos();
}
lb.addEventListener('click', closeLb);
lbVid.addEventListener('click', e => e.stopPropagation());

/* ---------- toques (clic) ---------- */
stage.addEventListener('click', e => {
  if(swiped) return;
  const act = e.target.closest('[data-act]');
  if(act && act.dataset.act === 'restart'){ restart(); return; }
  const pol = e.target.closest('.polaroid.has');
  if(pol){
    const m = pol.querySelector('img.ok, video.ok');
    if(m) openLb(m);
    return;
  }
  const face = e.target.closest('.face');
  if(!face) return;
  if(mode === 'spread'){
    turn(face.classList.contains('back') ? -1 : 1);
  } else {
    const r = face.getBoundingClientRect();
    const frac = (e.clientX - r.left) / r.width;
    turn((frac < 0.28 || pos === N_FACES - 1) ? -1 : 1);
  }
});

/* ---------- arrastrar la hoja con el dedo (o el mouse) ---------- */
function spineX(){
  const r = stage.getBoundingClientRect();
  const off = pos === 0 ? -200 : (pos === N_LEAVES ? 200 : 0);
  return r.left + (400 + off) * scale;
}

function startDrag(dx, x0){
  if(mode === 'spread'){
    const sx = spineX();
    if(dx < 0 && x0 >= sx && pos < N_LEAVES){ drag.dir = 1;  drag.k = pos;     drag.el = leaves[pos]; }
    else if(dx > 0 && x0 < sx && pos > 0){ drag.dir = -1; drag.k = pos - 1; drag.el = leaves[pos-1]; }
    else return false;
  } else {
    if(dx < 0 && pos < N_FACES - 1){ drag.dir = 1;  drag.k = pos;     drag.el = faces[pos]; }
    else if(dx > 0 && pos > 0){ drag.dir = -1; drag.k = pos - 1; drag.el = faces[pos-1]; }
    else return false;
  }
  drag.el.style.transition = 'none';
  drag.el.classList.add('dragging');
  if(book && (drag.k === 0 || drag.k === N_LEAVES - 1)) book.style.transition = 'none';
  return true;
}

function moveDrag(e){
  const w = 400 * scale;
  const dx = e.clientX - drag.x0;
  let c;
  if(mode === 'spread') c = drag.dir === 1 ? 1 + dx / w : -1 + dx / w;
  else c = drag.dir === 1 ? 1 + dx / w : dx / (w * 0.9);
  c = Math.max(-1, Math.min(1, c));
  if(mode === 'single' && drag.dir === -1) c = Math.max(0, c);
  drag.c = c;
  const ang = Math.acos(c);                       // 0 .. π  (hoja cerrada → hoja volteada)
  const el = drag.el;
  el.style.zIndex = 100;
  el.style.transform = `rotateY(${(-ang * 180 / Math.PI).toFixed(2)}deg)`;
  el.style.setProperty('--sh', (Math.sin(ang) * 0.7).toFixed(3));
  if(book){
    const t = ang / Math.PI;
    if(drag.k === 0) book.style.transform = `translateX(${(-200 * (1 - t)).toFixed(1)}px)`;
    else if(drag.k === N_LEAVES - 1) book.style.transform = `translateX(${(200 * t).toFixed(1)}px)`;
  }
  const now = performance.now(), dt = now - drag.lastT;
  if(dt > 0){
    drag.v = 0.6 * drag.v + 0.4 * ((e.clientX - drag.lastX) / dt);
    drag.lastX = e.clientX; drag.lastT = now;
  }
}

function finishDrag(d){
  const el = d.el, forward = d.dir === 1;
  let complete;
  if(mode === 'spread'){
    complete = forward ? (d.v < -0.5 || (d.c < 0.45 && d.v < 0.3))
                       : (d.v > 0.5  || (d.c > -0.45 && d.v > -0.3));
  } else {
    complete = forward ? (d.v < -0.5 || (d.c < 0.5 && d.v < 0.3))
                       : (d.v > 0.5  || (d.c > 0.35 && d.v > -0.3));
  }
  el.classList.remove('dragging');
  el.style.transition = '';
  if(book) book.style.transition = '';
  void el.offsetWidth;                          // aplica el estado actual antes de animar
  const prev = pos;
  if(mode === 'spread') pos = forward ? (complete ? d.k + 1 : d.k) : (complete ? d.k : d.k + 1);
  else pos = forward ? (complete ? pos + 1 : pos) : (complete ? pos - 1 : pos);
  el.style.setProperty('--sh', 0);
  swiped = true; setTimeout(() => { swiped = false; }, 350);
  applyState(prev, false, mode === 'spread' ? d.k : -1);
}

holder.addEventListener('pointerdown', e => {
  if(busy || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if(lb.classList.contains('show')) return;
  drag = { id:e.pointerId, x0:e.clientX, y0:e.clientY, lastX:e.clientX, lastT:performance.now(), v:0, c:1, active:false, dir:0, k:0, el:null };
});
holder.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.active){
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if(Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
    if(!startDrag(dx, drag.x0)){ drag = null; return; }
    drag.active = true;
    try{ holder.setPointerCapture(e.pointerId); }catch(_){}
  }
  moveDrag(e);
});
function endDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if(!d.active) return;
  if(performance.now() - d.lastT > 80) d.v = 0;
  finishDrag(d);
}
holder.addEventListener('pointerup', endDrag);
holder.addEventListener('pointercancel', endDrag);

btnNext.addEventListener('click', () => turn(1));
btnPrev.addEventListener('click', () => turn(-1));
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') turn(1);
  if(e.key === 'ArrowLeft') turn(-1);
  if(e.key === 'Escape') closeLb();
});

let rT;
function onResize(){
  clearTimeout(rT);
  rT = setTimeout(() => { buildMesa(); setMode(decideMode()); fit(); }, 120);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', onResize);

/* ---------- música: 2 canciones en bucle, suena sola ---------- */
const audio = new Audio();
audio.preload = 'auto'; audio.volume = CONFIG.volumen;
let track = 0, started = false, fails = 0;
const GESTOS = ['pointerup','touchend','click','keydown'];

function loadTrack(i){ track = i % PLAYLIST.length; audio.src = PLAYLIST[track]; }
function tryStart(){
  if(started || !PLAYLIST.length) return;
  if(!audio.src) loadTrack(0);
  const p = audio.play();
  if(p && p.then){
    p.then(() => {
      started = true;
      GESTOS.forEach(g => document.removeEventListener(g, tryStart, true));
    }).catch(() => {});
  }
}
audio.addEventListener('ended', () => { loadTrack(track + 1); audio.play().catch(() => {}); });
audio.addEventListener('playing', () => { fails = 0; });
audio.addEventListener('error', () => {
  fails++;
  if(fails >= PLAYLIST.length) return;
  loadTrack(track + 1); audio.play().catch(() => {});
});
// Intenta sonar apenas carga la página. Si el navegador lo bloquea (pasa en
// celulares), arranca con el primer toque en cualquier parte.
GESTOS.forEach(g => document.addEventListener(g, tryStart, true));
tryStart();

/* ---------- inicio ---------- */
document.title = `Collage  ${CONFIG.nombre} 🐾 ${CONFIG.edad} años`;
buildMesa();
mode = decideMode();
build();
fit();
</script>
</body>
</html>
